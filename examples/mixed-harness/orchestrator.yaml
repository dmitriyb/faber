version: 1

# One workflow, two harnesses: the implementer box runs a non-default agent
# CLI against a self-hosted endpoint, the reviewer box runs a different one —
# wired per role, purely as config. A template is a role's box, so the
# template is the harness↔role seam: the binary comes from its package set
# and FABER_AGENT_CLI, the invocation dialect from invoke:, and any
# provider/endpoint knobs from its opaque run.env. faber knows none of the
# vendor words below; they are all user data. (Gateless and network-open to
# stay minimal — see code-review-loop for the sealed posture.)

invoke_profiles:
  goose:
    # The goose CLI's headless dialect — check the flags against the harness
    # version your overlay pins; every field here is opaque to faber.
    subcommand: [run]
    prompt_flag: -t
    skill_mode: flag                # the skill rides its own flag pair ...
    skill_flag: --recipe            # ... instead of a /<skill> prompt prefix
    prompt_template: "{body}{extra}"
    fixed_flags: []                 # no permission-mode tail in this dialect
    model_flag: ""                  # model/provider come from the box env below;
    effort_flag: ""                 # no effort knob either — the pairs are dropped
    budget_flag: ""
    # The session dialect: where this harness keeps session transcripts and
    # how it resumes the latest one. `faber run task --sessions` then captures
    # each attempt's transcripts under the run directory, and
    # `faber resume <run> --interactive <step>` reopens a failed step inside
    # its saved session instead of a bare shell.
    session_dir: .local/share/goose/sessions
    resume_argv: [goose, session, resume, --last]

templates:
  implement:
    build:
      packages: [git, coreutils]
      overlay: ./nix/overlay.nix    # your derivation for the goose CLI
    run:
      env:
        FABER_AGENT_CLI: goose
        # Opaque template env: whatever this harness reads. Point it at a
        # local/self-hosted endpoint; faber passes the values through.
        GOOSE_PROVIDER: openai
        OPENAI_BASE_URL: http://llm:8000/v1
        GOOSE_MODEL: qwen3-coder
    invoke: {profile: goose}
    skill: implement
    model: qwen3-coder              # mandatory pin; this profile drops the flag
    effort: high                    # pair, so the harness reads them from env
    inputs:
      item: {type: string, required: true}
    output:
      change: {type: string, required: true}

  review:
    build:
      packages: [git, coreutils, claude-code]
    run:
      env: {FABER_AGENT_CLI: claude}
    # No invoke: block — the built-in default dialect
    # (-p <prompt> --permission-mode bypassPermissions --model … --effort …).
    skill: review
    model: claude-opus-5
    effort: high
    inputs:
      change: {type: string, required: true}
    output:
      verdict: {type: string, enum: [approved, changes], required: true}

workflows:
  task:
    params:
      item: {type: string, required: true}
    steps:
      - id: implement
        use: implement
        with: {item: "${params.item}"}
      - id: review
        use: review
        with: {change: "${steps.implement.change}"}
